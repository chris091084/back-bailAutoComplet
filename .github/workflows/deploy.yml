name: Build & Push to Scaleway

on:
  push:
    branches:
      - master1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au Container Registry Scaleway
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build de l'image Docker
        run: |
          docker build \
            -t ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/backend:${{ github.sha }} \
            -t ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/backend:latest \
            .

      - name: Push de l'image vers le registry
        run: |
          docker push ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/backend:${{ github.sha }}
          docker push ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}/backend:latest

      # ------------------------------------------------------------------
      # Étape de déploiement automatique : à décommenter une fois que le
      # Serverless Container est créé et que son ID est ajouté dans les
      # secrets GitHub sous le nom CONTAINER_ID.
